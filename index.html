<style>
/* =========================================================
   VARIABLES
   ========================================================= */
:root {
  --fondo: #BDEBFF;
  --marino: #14213d;
  --marino-oscuro: #070d1c;
  --gris: #4a6a80;
  --borde: #8fd3f0;
  --blanco: #ffffff;
  --suave: #f2fafe;
  --color: #8fd3f0;          /* lo cambia JS según el segmento ganador */
}

/* =========================================================
   BASE
   ========================================================= */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  max-width: 100%;
  overflow-x: hidden;
  background: var(--fondo);
}

body {
  color: var(--marino);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
body.bloqueado { overflow: hidden; }

button {
  font: inherit;
  font-weight: 800;
  border: none;
  border-radius: 14px;
  cursor: pointer;
  min-height: 48px;
  transition: transform .12s, opacity .2s;
}
button:disabled { opacity: .5; cursor: not-allowed; }
button:focus-visible { outline: 3px solid var(--marino); outline-offset: 2px; }

/* =========================================================
   PANTALLA PRINCIPAL
   ========================================================= */
.app {
  width: 100%;
  min-height: 100vh;
  min-height: 100dvh;
  overflow: hidden;            /* recorta la caja de la ruleta mientras gira */
  overflow: clip;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: clamp(10px, 2.2vh, 26px);
  padding: max(14px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
           max(14px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
}

h1 {
  font-size: clamp(1.5rem, 7vw, 2.6rem);
  font-weight: 800;
  text-align: center;
}

/* ---------- Ruleta ---------- */
.ruleta {
  --tam: 86vw;
  --tam: min(90vw, calc(100vh - 280px), 560px);
  --tam: min(90vw, calc(100dvh - 280px), 560px);
  position: relative;
  width: max(var(--tam), 220px);
  height: max(var(--tam), 220px);
  margin-top: 12px;
  flex-shrink: 0;
}

#lienzo {
  width: 100%;
  height: 100%;
  display: block;
  border-radius: 50%;
  box-shadow: 0 0 0 6px var(--blanco), 0 0 0 9px var(--marino), 0 14px 30px rgba(20, 33, 61, .25);
  cursor: pointer;
  will-change: transform;
}

.flecha {
  position: absolute;
  top: -16px;
  left: 50%;
  transform: translateX(-50%);
  border-left: clamp(12px, 3.6vw, 22px) solid transparent;
  border-right: clamp(12px, 3.6vw, 22px) solid transparent;
  border-top: clamp(26px, 7vw, 42px) solid var(--marino);
  filter: drop-shadow(0 3px 3px rgba(0, 0, 0, .3));
  z-index: 2;
  pointer-events: none;
}

.centro {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 18%;
  height: 18%;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background: var(--marino);
  color: var(--blanco);
  border: 4px solid var(--blanco);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: clamp(1rem, 4.5vw, 2rem);
  z-index: 2;
  pointer-events: none;
}

/* ---------- Controles ---------- */
.panel {
  width: min(100%, 420px);
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.fila { display: flex; gap: 10px; }

#btnGirar {
  width: 100%;
  min-height: 58px;
  font-size: clamp(1.2rem, 5vw, 1.6rem);
  background: var(--marino);
  color: var(--blanco);
  box-shadow: 0 5px 0 var(--marino-oscuro);
}
#btnGirar:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 var(--marino-oscuro); }

.btn-sec {
  flex: 1;
  padding: 10px 12px;
  background: var(--blanco);
  color: var(--marino);
  border: 2px solid var(--borde);
  font-size: clamp(.85rem, 3.6vw, 1rem);
  white-space: nowrap;
}
.btn-sec:active:not(:disabled) { transform: scale(.96); }

/* ---------- Historial ---------- */
.historial {
  display: flex;
  gap: 8px;
  min-height: 34px;
  overflow-x: auto;
  scrollbar-width: none;
  justify-content: center;
}
.historial::-webkit-scrollbar { display: none; }
.historial:empty::before {
  content: "Toca la ruleta o el botón para girar";
  color: var(--gris);
  font-size: .85rem;
  align-self: center;
}
.historial span {
  flex: 0 0 auto;
  height: 34px;
  padding: 0 10px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  font-weight: 800;
  font-size: .95rem;
  white-space: nowrap;
  animation: aparecer .3s ease;
}

/* =========================================================
   RESULTADO
   ========================================================= */
.fondo-modal {
  position: fixed;
  top: 0; right: 0; bottom: 0; left: 0;
  background: rgba(10, 35, 55, .65);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  opacity: 0;
  pointer-events: none;
  transition: opacity .3s;
  z-index: 10;
}
.fondo-modal.abierto { opacity: 1; pointer-events: auto; }

.tarjeta {
  width: min(100%, 340px);
  max-height: calc(100vh - 32px);
  max-height: calc(100dvh - 32px);
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: clamp(6px, 1.4vh, 10px);
  padding: clamp(12px, 3.5vw, 18px);
  background: var(--blanco);
  border: 3px solid var(--color);
  border-radius: 20px;
  box-shadow: 0 0 30px var(--color);
  text-align: center;
  transform: scale(.7);
  transition: transform .35s cubic-bezier(.34, 1.56, .64, 1);
}
.fondo-modal.abierto .tarjeta { transform: scale(1); }

.etiqueta {
  font-size: .75rem;
  color: var(--gris);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .08em;
}

.verbo {
  align-self: center;
  font-size: clamp(1.7rem, 8vw, 2.4rem);
  font-weight: 900;
  line-height: 1;
  padding-bottom: 6px;
  border-bottom: 4px solid var(--color);
  overflow-wrap: anywhere;
}

.formas { display: flex; gap: 8px; }
.forma {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 1px;
  padding: 6px 4px;
  background: var(--suave);
  border: 2px solid var(--color);
  border-radius: 12px;
}
.forma small {
  font-size: .65rem;
  color: var(--gris);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .06em;
}
.forma strong {
  font-size: clamp(.95rem, 4.2vw, 1.15rem);
  font-weight: 800;
  overflow-wrap: anywhere;
}

.foto {
  width: 100%;
  height: 200px;
  height: clamp(130px, 30vh, 240px);
  height: clamp(130px, 30dvh, 240px);
  display: block;
  object-fit: contain;
  padding: 4px;
  background: var(--blanco);
  border: 2px solid var(--color);
  border-radius: 14px;
}

.acciones { display: flex; gap: 8px; }
.acciones button {
  flex: 1;
  min-height: 44px;
  padding: 8px 10px;
  font-size: .95rem;
  border-radius: 12px;
  white-space: nowrap;
}
#btnOtraVez { background: var(--color); color: var(--marino); }

@keyframes aparecer { from { transform: scale(0); } to { transform: scale(1); } }

/* =========================================================
   PASOS DEL JUEGO
   ========================================================= */
.pasos {
  display: none;                 /* en celular se abren con el botón "Pasos" */
  flex-direction: column;
  gap: 14px;
  padding: 22px;
  background: var(--blanco);
  border: 3px solid var(--marino);
  border-radius: 20px;
  box-shadow: 0 8px 0 rgba(20, 33, 61, .15);
}

.pasos h2 {
  font-size: 1.35rem;
  font-weight: 800;
}

.lista-pasos {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 10px;
  text-align: left;
}
.lista-pasos li {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 1rem;
  font-weight: 600;
  line-height: 1.3;
}
.lista-pasos .num {
  flex: 0 0 34px;
  height: 34px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 900;
  color: var(--marino);
  border: 2px solid var(--marino);
}
.lista-pasos .step {
  display: block;
  font-size: .7rem;
  font-weight: 800;
  color: var(--gris);
  text-transform: uppercase;
  letter-spacing: .08em;
}

/* Tarjeta de pasos en celular */
.tarjeta-pasos {
  width: min(100%, 360px);
  max-height: calc(100vh - 32px);
  max-height: calc(100dvh - 32px);
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 14px;
  padding: 20px 18px;
  background: var(--blanco);
  border: 3px solid var(--marino);
  border-radius: 20px;
  transform: scale(.7);
  transition: transform .35s cubic-bezier(.34, 1.56, .64, 1);
}
.fondo-modal.abierto .tarjeta-pasos { transform: scale(1); }
.tarjeta-pasos h2 { font-size: 1.3rem; font-weight: 800; text-align: center; }
#btnJugar {
  min-height: 50px;
  background: var(--marino);
  color: var(--blanco);
  font-size: 1.1rem;
  box-shadow: 0 4px 0 var(--marino-oscuro);
}

/* =========================================================
   RESPONSIVE
   ========================================================= */

/* Celulares bajitos (iPhone SE y similares) */
@media (max-height: 640px) and (orientation: portrait) {
  h1 { font-size: 1.3rem; }
  .ruleta {
    --tam: min(84vw, calc(100vh - 250px));
    --tam: min(84vw, calc(100dvh - 250px));
  }
  #btnGirar { min-height: 52px; }
  .panel { gap: 8px; }
}

/* Celular en horizontal: ruleta a la izquierda, controles a la derecha */
@media (orientation: landscape) and (max-height: 520px) {
  .app {
    display: grid;
    grid-template-columns: auto minmax(220px, 340px);
    grid-template-rows: auto 1fr;
    column-gap: 5vw;
    row-gap: 10px;
    align-content: center;
    justify-content: center;
  }
  .ruleta {
    --tam: calc(100vh - 56px);
    --tam: calc(100dvh - 56px);
    grid-column: 1;
    grid-row: 1 / 3;
    width: var(--tam);
    height: var(--tam);
    align-self: center;
  }
  h1 { grid-column: 2; grid-row: 1; align-self: end; font-size: 1.5rem; }
  .panel { grid-column: 2; grid-row: 2; align-self: start; }
  .historial { justify-content: flex-start; }

  .fondo-modal { padding: 10px; }
  .tarjeta {
    width: min(92vw, 520px);
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px 14px;
    align-items: center;
    padding: 12px;
  }
  .tarjeta > * { grid-column: 1; }
  .verbo { justify-self: center; }
  .foto { grid-column: 2; grid-row: 1 / span 4; height: 100%; max-height: calc(100dvh - 60px); }
}

/* PC grande */
@media (min-width: 900px) and (min-height: 700px) {
  .ruleta { --tam: min(60vh, 560px); }
}

/* PC: pasos siempre visibles a la derecha de la ruleta */
@media (min-width: 1000px) and (min-height: 600px) {
  .app {
    display: grid;
    grid-template-columns: auto minmax(300px, 380px);
    grid-template-areas:
      "titulo  titulo"
      "ruleta  pasos"
      "panel   pasos";
    column-gap: clamp(32px, 5vw, 72px);
    row-gap: 18px;
    align-content: center;
    justify-content: center;
  }
  .ruleta { --tam: min(56vh, 520px); grid-area: ruleta; justify-self: center; }
  h1 { grid-area: titulo; }
  .panel { grid-area: panel; justify-self: center; }
  .pasos { display: flex; grid-area: pasos; align-self: center; padding: 26px; }
  .pasos h2 { font-size: 1.7rem; }
  .pasos .lista-pasos { gap: 14px; }
  .pasos .lista-pasos li { font-size: 1.15rem; }
  .pasos .lista-pasos .num { flex-basis: 40px; height: 40px; font-size: 1.1rem; }
  #btnPasos { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  .tarjeta, .fondo-modal { transition: none; }
}
</style>
</head>
<body>

<main class="app">
  <h1>Verb Wheel</h1>

  <div class="ruleta">
    <div class="flecha"></div>
    <canvas id="lienzo" aria-label="Ruleta de verbos, toca para girar"></canvas>
    <div class="centro">★</div>
  </div>

  <div class="panel">
    <button id="btnGirar">SPIN!</button>
    <div class="fila">
      <button class="btn-sec" id="btnMezclar">🎨 Shuffle</button>
      <button class="btn-sec" id="btnSonido">🔊 Sound</button>
      <button class="btn-sec" id="btnPasos">📋 Steps</button>
    </div>
    <div class="historial" id="historial"></div>
  </div>

  <!-- Pasos visibles en PC -->
  <aside class="pasos" aria-labelledby="tituloPasos">
    <h2 id="tituloPasos">How to play</h2>
    <ol class="lista-pasos" id="listaPasosPC"></ol>
  </aside>
</main>

<!-- Pasos en celular -->
<div class="fondo-modal" id="fondoPasos">
  <div class="tarjeta-pasos" role="dialog" aria-modal="true" aria-labelledby="tituloPasosMovil">
    <h2 id="tituloPasosMovil">How to play</h2>
    <ol class="lista-pasos" id="listaPasosMovil"></ol>
    <button id="btnJugar">Let's play!</button>
  </div>
</div>

<div class="fondo-modal" id="fondoModal">
  <div class="tarjeta" id="tarjeta" role="dialog" aria-modal="true" aria-labelledby="verbo">
    <div class="etiqueta">Salió el verbo</div>
    <div class="verbo" id="verbo">Celebrate</div>
    <div class="formas">
      <div class="forma"><small>Pasado</small><strong id="pasado">Celebrated</strong></div>
    </div>
    <img class="foto" id="foto" alt="" referrerpolicy="no-referrer">
    <div class="acciones">
      <button class="btn-sec" id="btnCerrar">Cerrar</button>
      <button id="btnOtraVez">Girar otra vez</button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   DATOS: verbo (en la ruleta), pasado, imagen y emoji
   (el emoji solo se usa si la imagen no puede cargar)
   ========================================================= */
const VERBOS = [
  { base: "Celebrate", pasado: "Celebrated", imagen: "https://illustoon.com/photo/12421.png", emoji: "🎉" },
  { base: "Decorate",  pasado: "Decorated",  imagen: "https://i.postimg.cc/1gnXqz9g/Decorate.png",  emoji: "🎄" },
  { base: "Help",      pasado: "Helped",     imagen: "https://i.postimg.cc/Ny9FH0gm/Help.jpg",      emoji: "🤝" },
  { base: "Enjoy",     pasado: "Enjoyed",    imagen: "https://i.postimg.cc/bG7JHjJt/Enjoy.jpg",     emoji: "😄" },
  { base: "Dance",     pasado: "Danced",     imagen: "https://i.postimg.cc/FfMRgQRj/Dance.jpg",     emoji: "💃" },
  { base: "Pray",      pasado: "Prayed",     imagen: "https://i.ibb.co/hRHKKkDC/pray.jpg",          emoji: "🙏" },
  { base: "Travel",    pasado: "Traveled",   imagen: "https://i.postimg.cc/XZRJc0JZ/Travel.jpg",    emoji: "✈️" },
  { base: "Bake",      pasado: "Baked",      imagen: "https://i.ibb.co/LhhSv3Jy/bake.jpg",          emoji: "🧁" },
  { base: "Play",      pasado: "Played",     imagen: "https://i.postimg.cc/d7k3y0q8/Play.jpg",      emoji: "⚽" },
  { base: "Paint",     pasado: "Painted",    imagen: "https://i.postimg.cc/946MtjMT/Paint.jpg",     emoji: "🎨" },
  { base: "Cook",      pasado: "Cooked",     imagen: "https://i.postimg.cc/zLbvgfJT/Cook.jpg",      emoji: "🍳" }
];

const PALETA = ["#FF8A80", "#FFB570", "#FFD966", "#B5E48C", "#7BDCB5", "#5CCFE6",
                "#6FA8FF", "#9B9CFF", "#C3A6FF", "#E89BF2", "#FF9EC7"];

// Instrucciones del juego (se muestran en PC y en el botón "Pasos" del celular)
const PASOS = [
  "Spin the verb wheel.",
  "Read the verb.",
  "Imitate the verb.",
  "Ask a friend to guess.",
  "High five and pass the turn!",
  "Spin the wheel again."
];

const TEXTO = "#14213d";
const TOTAL = VERBOS.length;
const SEG = (Math.PI * 2) / TOTAL;
const VUELTA = Math.PI * 2;

/* =========================================================
   ELEMENTOS Y ESTADO
   ========================================================= */
const $ = id => document.getElementById(id);
const lienzo = $("lienzo");
const ctx = lienzo.getContext("2d");
const fondoModal = $("fondoModal");
const tarjeta = $("tarjeta");
const foto = $("foto");
const fondoPasos = $("fondoPasos");

let colores = [];
let rotacion = 0;
let girando = false;
let sonido = true;
let audio = null;

/* =========================================================
   IMÁGENES: se cargan al abrir y quedan listas en memoria
   ========================================================= */
const cache = VERBOS.map(v => {
  const img = new Image();
  if (!v.imagen) return img;
  img.referrerPolicy = "no-referrer";
  img.decoding = "async";
  img.src = v.imagen;
  return img;
});

function imagenRespaldo(i) {
  const v = VERBOS[i];
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
    <rect width="800" height="500" fill="${colores[i]}"/>
    <text x="400" y="220" font-size="220" text-anchor="middle" dominant-baseline="middle">${v.emoji}</text>
    <text x="400" y="430" font-size="54" font-weight="800" font-family="sans-serif"
          text-anchor="middle" fill="${TEXTO}">${v.base}</text></svg>`;
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
}

function mostrarFoto(i) {
  const v = VERBOS[i];
  foto.alt = v.base;
  foto.onerror = () => { foto.onerror = null; foto.src = imagenRespaldo(i); };
  // Verbo sin imagen propia: se muestra directamente el dibujo con emoji
  if (!v.imagen) { foto.onerror = null; foto.src = imagenRespaldo(i); return; }
  // Si la precarga falló se reintenta; si ya cargó, sale al instante desde la memoria
  const fallo = cache[i].complete && cache[i].naturalWidth === 0;
  foto.src = fallo ? v.imagen + "?r=" + Date.now() : v.imagen;
}

/* =========================================================
   COLORES Y DIBUJO
   ========================================================= */
function mezclar(lista) {
  const a = [...lista];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function nuevosColores() {
  colores = mezclar(PALETA).slice(0, TOTAL);
}

function dibujar() {
  const tam = lienzo.clientWidth;
  if (!tam) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  lienzo.width = Math.round(tam * dpr);
  lienzo.height = Math.round(tam * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const c = tam / 2;
  for (let i = 0; i < TOTAL; i++) {
    const ini = -Math.PI / 2 + i * SEG;

    ctx.beginPath();
    ctx.moveTo(c, c);
    ctx.arc(c, c, c, ini, ini + SEG);
    ctx.closePath();
    ctx.fillStyle = colores[i];
    ctx.fill();
    ctx.lineWidth = Math.max(2, tam * 0.008);
    ctx.strokeStyle = "#ffffff";
    ctx.stroke();

    // Palabra a lo largo del radio, ajustada para que siempre quepa
    ctx.save();
    ctx.translate(c, c);
    ctx.rotate(ini + SEG / 2);
    ctx.textAlign = "right";
    ctx.textBaseline = "middle";
    ctx.fillStyle = TEXTO;
    const espacio = c * 0.68;
    let fuente = tam * 0.062;
    ctx.font = `800 ${fuente}px system-ui, sans-serif`;
    const ancho = ctx.measureText(VERBOS[i].base).width;
    if (ancho > espacio) {
      fuente *= espacio / ancho;
      ctx.font = `800 ${fuente}px system-ui, sans-serif`;
    }
    ctx.fillText(VERBOS[i].base, c * 0.92, 0);
    ctx.restore();
  }
  lienzo.style.transform = `rotate(${rotacion}rad)`;
}

/* =========================================================
   SONIDO Y VIBRACIÓN
   ========================================================= */
function activarAudio() {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === "suspended") audio.resume();
  } catch (e) { audio = null; }
}

function tono(frecuencia, inicio, duracion, volumen, tipo) {
  const osc = audio.createOscillator();
  const gan = audio.createGain();
  osc.type = tipo;
  osc.frequency.value = frecuencia;
  gan.gain.setValueAtTime(volumen, inicio);
  gan.gain.exponentialRampToValueAtTime(0.001, inicio + duracion);
  osc.connect(gan).connect(audio.destination);
  osc.start(inicio);
  osc.stop(inicio + duracion);
}

function tic() {
  if (sonido && audio) tono(900, audio.currentTime, 0.04, 0.06, "square");
  if (navigator.vibrate) navigator.vibrate(5);
}

function fanfarria() {
  if (navigator.vibrate) navigator.vibrate([60, 40, 120]);
  if (!sonido || !audio) return;
  [523, 659, 784, 1047].forEach((f, i) => tono(f, audio.currentTime + i * 0.1, 0.3, 0.15, "triangle"));
}

/* =========================================================
   GIRO
   ========================================================= */
function girar() {
  if (girando || fondoModal.classList.contains("abierto") || fondoPasos.classList.contains("abierto")) return;
  activarAudio();
  girando = true;
  $("btnGirar").disabled = true;
  $("btnMezclar").disabled = true;

  const ganador = Math.floor(Math.random() * TOTAL);
  const variacion = (Math.random() - 0.5) * SEG * 0.7;
  const objetivo = -(ganador + 0.5) * SEG + variacion;
  const actual = ((rotacion % VUELTA) + VUELTA) % VUELTA;
  const delta = (((objetivo - actual) % VUELTA) + VUELTA) % VUELTA;
  const inicio = rotacion;
  const destino = rotacion + delta + (5 + Math.floor(Math.random() * 3)) * VUELTA;
  const duracion = 5000 + Math.random() * 1000;
  const t0 = performance.now();
  let ultimo = Math.floor(inicio / SEG);

  function cuadro(ahora) {
    const t = Math.min(Math.max((ahora - t0) / duracion, 0), 1);
    rotacion = inicio + (destino - inicio) * (1 - Math.pow(1 - t, 4));
    lienzo.style.transform = `rotate(${rotacion}rad)`;

    const seg = Math.floor(rotacion / SEG);
    if (seg !== ultimo) { tic(); ultimo = seg; }

    if (t < 1) return requestAnimationFrame(cuadro);

    rotacion %= VUELTA;
    lienzo.style.transform = `rotate(${rotacion}rad)`;
    girando = false;
    $("btnGirar").disabled = false;
    $("btnMezclar").disabled = false;
    abrirResultado(ganador);
  }
  requestAnimationFrame(cuadro);
}

/* =========================================================
   RESULTADO
   ========================================================= */
function abrirResultado(i) {
  const v = VERBOS[i];
  tarjeta.style.setProperty("--color", colores[i]);
  $("verbo").textContent = v.base;
  $("pasado").textContent = v.pasado;
  mostrarFoto(i);

  const historial = $("historial");
  const chip = document.createElement("span");
  chip.textContent = v.base;
  chip.style.background = colores[i];
  historial.prepend(chip);
  historial.scrollLeft = 0;
  while (historial.children.length > 10) historial.lastChild.remove();

  fanfarria();
  tarjeta.scrollTop = 0;
  fondoModal.classList.add("abierto");
  document.body.classList.add("bloqueado");
}

function cerrarResultado() {
  fondoModal.classList.remove("abierto");
  document.body.classList.remove("bloqueado");
}

/* =========================================================
   EVENTOS
   ========================================================= */
$("btnGirar").addEventListener("click", girar);
lienzo.addEventListener("click", girar);

$("btnMezclar").addEventListener("click", () => {
  if (girando) return;
  nuevosColores();
  dibujar();
});

$("btnSonido").addEventListener("click", () => {
  sonido = !sonido;
  $("btnSonido").textContent = sonido ? "🔊 Sound" : "🔇 Muted";
});

$("btnCerrar").addEventListener("click", cerrarResultado);

$("btnPasos").addEventListener("click", () => {
  fondoPasos.classList.add("abierto");
  document.body.classList.add("bloqueado");
});
function cerrarPasos() {
  fondoPasos.classList.remove("abierto");
  document.body.classList.remove("bloqueado");
}
$("btnJugar").addEventListener("click", cerrarPasos);
fondoPasos.addEventListener("click", e => { if (e.target === fondoPasos) cerrarPasos(); });
$("btnOtraVez").addEventListener("click", () => { cerrarResultado(); setTimeout(girar, 380); });
fondoModal.addEventListener("click", e => { if (e.target === fondoModal) cerrarResultado(); });

document.addEventListener("keydown", e => {
  if (e.key === "Escape") { cerrarResultado(); cerrarPasos(); }
  const enBoton = document.activeElement && document.activeElement.tagName === "BUTTON";
  if ((e.key === " " || e.key === "Enter") && !enBoton && !fondoModal.classList.contains("abierto")
      && !fondoPasos.classList.contains("abierto")) {
    e.preventDefault();
    girar();
  }
});

if ("ResizeObserver" in window) new ResizeObserver(dibujar).observe(lienzo);
else window.addEventListener("resize", dibujar);

/* =========================================================
   INICIO
   ========================================================= */
function mostrarPasos() {
  const html = PASOS.map((texto, i) =>
    `<li><span class="num" style="background:${PALETA[i % PALETA.length]}">${i + 1}</span>
       <span><span class="step">Step ${i + 1}</span>${texto}</span></li>`).join("");
  $("listaPasosPC").innerHTML = html;
  $("listaPasosMovil").innerHTML = html;
}

nuevosColores();
dibujar();
mostrarPasos();
</script>
</body>
